<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUCK DUCK - Multiplayer 3D Park</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Giriş / İsim Sorma Ekranı */
        #login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(20,20,30,0.85) 0%, rgba(5,5,10,0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .login-card {
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .login-card h1 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .login-card p {
            margin: 0 0 25px 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: #333;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            border-color: #f1c40f;
        }

        .login-card button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            background: #f1c40f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.3);
            transition: all 0.2s ease;
        }

        .login-card button:hover {
            background: #e1b700;
            transform: translateY(-2px);
        }

        /* Kontrol İpuçları */
        #ui-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>

    <!-- Three.js ve Socket.io Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Kullanıcı Giriş Katmanı -->
    <div id="login-overlay">
        <div class="login-card">
            <h1>🐥 DUCK DUCK</h1>
            <p>Parka katılmak için bir isim seç</p>
            <input id="username-input" type="text" placeholder="Örn: Ayşe, Mehmet..." maxlength="12" autofocus />
            <button id="join-btn">Parka Gir</button>
        </div>
    </div>

    <!-- Tuş Bilgilendirme -->
    <div id="ui-controls">
        🎮 <b>Kontroller:</b> W, A, S, D veya Yön Tuşları ile hareket et
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. SAHNE, IŞIK VE KAMERA KURULUMU ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0e0ff);
        scene.fog = new THREE.FogExp2(0xa0e0ff, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Işıklar
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Yeşil Zemin (Park)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Parka Birkaç Ağaç Ekleyelim
        function createTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 2, 8),
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
            );
            trunk.position.set(x, 1, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const foliage = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1.5),
                new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
            );
            foliage.position.set(x, 2.8, z);
            foliage.castShadow = true;
            scene.add(foliage);
        }
        for (let i = 0; i < 20; i++) {
            const rx = (Math.random() - 0.5) * 80;
            const rz = (Math.random() - 0.5) * 80;
            if (Math.abs(rx) > 5 || Math.abs(rz) > 5) createTree(rx, rz);
        }

        // --- 2. 3D İSİM ETİKETİ FONKSİYONU (SPRITE TEXT) ---
        function createNameTag(name) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;

            // Arka plan hap kutusu
            ctx.fillStyle = 'rgba(20, 20, 20, 0.7)';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(8, 8, 240, 48, 12);
            } else {
                ctx.rect(8, 8, 240, 48);
            }
            ctx.fill();

            // İsim Yazısı
            ctx.font = 'bold 24px Arial, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(3, 0.75, 1);
            sprite.position.set(0, 2.2, 0); // Ördeğin baş hizası
            return sprite;
        }

        // --- 3. OYUNCU VE MODEL DEĞİŞKENLERİ ---
        const loader = new THREE.GLTFLoader();
        let duckTemplate = null;

        let myDuck = null;
        let myUsername = '';
        let isGameStarted = false;
        const otherPlayers = {}; // { socketId: { mesh, targetPos, targetRot } }

        // Ördek 3D Modelini Önden Hazırla
        loader.load('models/duck.glb', (gltf) => {
            duckTemplate = gltf.scene;
            duckTemplate.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            console.log("Model başarıyla yüklendi.");
        }, undefined, (err) => {
            console.error("Model yükleme hatası:", err);
            // Yedek Sarı Kutu (model yüklenemezse)
            const fallback = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshLambertMaterial({ color: 0xffcc00 })
            );
            duckTemplate = fallback;
        });

        // --- 4. SOKET BAĞLANTISI VE ÇOK OYUNCULU MANTIK ---
        const socket = io();

        // Giriş butonuna basılınca
        const loginOverlay = document.getElementById('login-overlay');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');

        function startGame() {
            const enteredName = usernameInput.value.trim();
            myUsername = enteredName !== '' ? enteredName : 'Ördek_' + Math.floor(Math.random() * 1000);
            loginOverlay.style.display = 'none';

            // Kendi ördeğimizi oluştur
            spawnMyDuck();

            // Sunucuya ismimizi gönderip oyuna dahil ol
            socket.emit('joinGame', myUsername);
            isGameStarted = true;
        }

        joinBtn.addEventListener('click', startGame);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startGame();
        });

        function spawnMyDuck() {
            if (duckTemplate) {
                myDuck = duckTemplate.clone();
            } else {
                myDuck = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffcc00 }));
            }
            myDuck.position.set(0, 0, 0);
            
            // Kafasının üstüne isim etiketini iliştir
            const nameTag = createNameTag(myUsername);
            myDuck.add(nameTag);

            scene.add(myDuck);
        }

        // Oyuna girdiğimizde içerideki mevcut oyuncuları al
        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach((id) => {
                if (id !== socket.id) {
                    addOtherPlayer(players[id]);
                }
            });
        });

        // Yeni birisi katıldığında
        socket.on('newPlayer', (playerInfo) => {
            addOtherPlayer(playerInfo);
        });

        // Başka bir oyuncunun ördeğini sahneye ekleme
        function addOtherPlayer(playerInfo) {
            if (otherPlayers[playerInfo.id]) return;

            let otherDuck;
            if (duckTemplate) {
                otherDuck = duckTemplate.clone();
            } else {
                otherDuck = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xff9900 }));
            }

            otherDuck.position.set(playerInfo.x, playerInfo.y, playerInfo.z);
            otherDuck.rotation.y = playerInfo.rotation || 0;

            // Gelen oyuncunun kullanıcı adını tepesine ekle
            const tag = createNameTag(playerInfo.username || 'Misafir');
            otherDuck.add(tag);

            scene.add(otherDuck);
            otherPlayers[playerInfo.id] = {
                mesh: otherDuck,
                targetPos: new THREE.Vector3(playerInfo.x, playerInfo.y, playerInfo.z),
                targetRot: playerInfo.rotation || 0
            };
        }

        // Diğer oyuncu hareket ettiğinde
        socket.on('playerMoved', (playerInfo) => {
            if (otherPlayers[playerInfo.id]) {
                otherPlayers[playerInfo.id].targetPos.set(playerInfo.x, playerInfo.y, playerInfo.z);
                otherPlayers[playerInfo.id].targetRot = playerInfo.rotation;
            }
        });

        // Bir oyuncu çıktığında
        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id].mesh);
                delete otherPlayers[id];
            }
        });

        // --- 5. KLAVYE KONTROLLERİ VE HAREKET ---
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const moveSpeed = 0.15;
        const rotateSpeed = 0.05;

        function handleInput() {
            if (!myDuck || !isGameStarted) return;

            let moved = false;

            if (keys['w'] || keys['arrowup']) {
                myDuck.translateZ(moveSpeed);
                moved = true;
            }
            if (keys['s'] || keys['arrowdown']) {
                myDuck.translateZ(-moveSpeed);
                moved = true;
            }
            if (keys['a'] || keys['arrowleft']) {
                myDuck.rotation.y += rotateSpeed;
                moved = true;
            }
            if (keys['d'] || keys['arrowright']) {
                myDuck.rotation.y -= rotateSpeed;
                moved = true;
            }

            // Pozisyonu sunucuya aktar
            if (moved) {
                socket.emit('playerMovement', {
                    x: myDuck.position.x,
                    y: myDuck.position.y,
                    z: myDuck.position.z,
                    rotation: myDuck.rotation.y
                });
            }

            // Kamerayı ördeğin arkasından yumuşakça takip ettir (3. şahıs kamera)
            const relativeCameraOffset = new THREE.Vector3(0, 5, -8);
            const cameraOffset = relativeCameraOffset.applyMatrix4(myDuck.matrixWorld);
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(myDuck.position.x, myDuck.position.y + 1, myDuck.position.z);
        }

        // --- 6. OYUN DÖNGÜSÜ (RENDER LOOP) ---
        function animate() {
            requestAnimationFrame(animate);

            handleInput();

            // Diğer oyuncuların pozisyonlarını yumuşatarak kaydır (Lerp)
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                p.mesh.position.lerp(p.targetPos, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.targetRot, 0.2);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Pencere boyutu değiştiğinde
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
